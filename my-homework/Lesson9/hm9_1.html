<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid {
        height: 100vh;
        display: grid;
        grid-template-rows: 1fr 3fr 1fr;
      }
      header,
      footer {
        background: #d9d9d9;
      }
      main {
        background: #a4a4a4;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <header></header>
      <main></main>
      <footer></footer>
    </div>
  </body>
</html>
