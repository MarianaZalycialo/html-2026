<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid {
        width: 100vh;
        display: grid;
        grid-template-rows: 1fr 3fr 2fr;
      }
      main {
        width: 100vw;
        display: grid;
        grid-template-columns: 3fr 2fr;
      }
      header,
      .top {
        background: #d9d9d9;
      }
      .left {
        background: #a4a4a4;
      }
      .right-top {
        background: #7f7a7a;
      }
      .right-buttom {
        background: #615050;
      }
      .buttom {
        background: #afa9a9;
      }
      .right {
        height: 100vh;
        display: grid;
        grid-template-rows: repeat(2, 1fr);
      }
      footer {
        display: grid;
        grid-template-rows: repeat(2, 1fr);
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <header></header>
      <main>
        <aside class="left"></aside>
        <aside class="right">
          <div class="right-top"></div>
          <div class="right-buttom"></div>
        </aside>
      </main>
      <footer>
        <div class="top"></div>
        <div class="buttom"></div>
      </footer>
    </div>
  </body>
</html>
