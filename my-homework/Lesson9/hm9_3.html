<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid {
        display: grid;
        height: 100vh;
        grid-template-rows: 1fr 3fr 1fr;
      }
      header,
      footer {
        background: #d9d9d9;
      }
      .content {
        width: 100vw;
        display: grid;
        grid-template-columns: 1fr 3fr 1fr;
      }
      .left,
      .right {
        background: #c0bdbd;
      }
      main {
        display: grid;
        grid-template-rows: repeat(2, 1fr);
      }
      .top {
        background: #827878;
      }
      .bottom {
        background: #b7adad;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <header></header>
      <div class="content">
        <aside class="left"></aside>
        <main>
          <div class="top"></div>
          <div class="bottom"></div>
        </main>
        <aside class="right"></aside>
      </div>
      <footer></footer>
    </div>
  </body>
</html>
